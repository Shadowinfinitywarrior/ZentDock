[package]
name = "zentdock"
version = "1.0.0"
edition = "2021"
authors = ["Mr. Nithish Kathiravan <nithishkathiravan123@gmail.com>"]
description = "Comprehensive molecular docking software for protein-ligand, protein-protein and other docking simulations"
license = "MIT"

[[bin]]
name = "zentdock"
path = "src/main.rs"

[dependencies]
serde = { version = "1.0.100", features = ["derive"] }
serde_json = "1.0"
toml = "0.5"
clap = { version = "2.33" }
parking_lot = "0.10"
rand = "0.7"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "0.8", features = ["v4"] }
anyhow = "1.0"
directories = "2.0"
lazy_static = "1.4"

[profile.release]
opt-level = 3
lto = true